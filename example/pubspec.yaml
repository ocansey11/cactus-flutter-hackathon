name: cactus_example
description: Example app for the `cactus` library.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cactus:
    path: ../
  read_pdf_text: ^0.3.1
  file_picker: ^10.3.3
  image_picker: ^1.0.0
  path_provider: ^2.1.5
  path: ^1.8.3
  flutter_tts: ^4.2.0
  objectbox: ^5.0.0              
  objectbox_flutter_libs: ^5.0.1  
  uuid: ^4.5.1    
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0          
  objectbox_generator: any 

flutter:
  uses-material-design: true
  assets:
    - assets/.cactus_dev_config.json
